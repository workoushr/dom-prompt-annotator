<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DPA E2E Fixture</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: light;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 32px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #111827;
      background: #f9fafb;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 24px;
      line-height: 1.25;
    }
    .card {
      max-width: 480px;
      padding: 24px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }
    label {
      font-size: 14px;
      font-weight: 600;
    }
    input {
      height: 36px;
      padding: 0 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      background: #2563eb;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .secret {
      margin-top: 20px;
      padding: 12px;
      border: 1px dashed #ef4444;
      border-radius: 6px;
      color: #991b1b;
      background: #fef2f2;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Account settings</h1>
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" type="email" value="user@example.com" autocomplete="off" />
    </div>
    <button id="primary-btn" type="button">Save changes</button>
    <p class="secret" data-mask="true">Secret: account token 12345</p>
  </main>
</body>
</html>
