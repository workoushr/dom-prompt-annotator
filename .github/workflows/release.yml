name: Release Asset Upload

on:
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package extension zip
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME=$(node -p "require('./package.json').version")
            TAG_NAME="v${TAG_NAME#v}"
          fi
          cd dist
          zip -r "../dom-prompt-annotator-${TAG_NAME}.zip" .
          cd ..
          echo "ZIP_PATH=dom-prompt-annotator-${TAG_NAME}.zip" >> $GITHUB_ENV

      - name: Upload zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
